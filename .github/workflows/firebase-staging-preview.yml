name: TalkOS Firebase Staging Preview

# Deliberately manual. Does NOT deploy to the live Hosting channel, deploy
# Firestore rules, deploy Cloud Functions, or publish a production release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talkos-firebase-staging
  cancel-in-progress: false

jobs:
  preview:
    name: Validate and deploy isolated staging preview
    runs-on: ubuntu-latest
    environment: firebase-staging
    timeout-minutes: 20
    env:
      STAGING_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.STAGING_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.STAGING_FIREBASE_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in STAGING_PROJECT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_DATABASE_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing staging configuration: $key"
              exit 1
            fi
          done
          if [ "$STAGING_PROJECT_ID" = "gen-lang-client-0658820145" ]; then
            echo "::error::Staging must use a separate Firebase project from the bundled application project"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build static Firebase Hosting assets
        run: npm run build:pwa
      - name: Deploy temporary staging preview only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          channelId: talkos-staging
          expires: 7d
          entryPoint: .
