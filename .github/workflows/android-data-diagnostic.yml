name: TalkOS read-only data diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-data-diagnostic.yml'
      - 'ci/diagnose-data-access.py'
permissions:
  contents: read
jobs:
  inspect-existing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the existing staging deployment identity for reads only
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/93376253053/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: talkos-github-deployer@talkos-staging-default.iam.gserviceaccount.com
          project_id: talkos-staging-default
          token_format: access_token
          access_token_lifetime: 300s
      - name: Inspect counts and deployed rule conditions without writes
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python ci/diagnose-data-access.py
      - uses: actions/upload-artifact@v4
        with:
          name: TalkOS-read-only-data-diagnosis
          path: data-diagnosis.json
          retention-days: 7
