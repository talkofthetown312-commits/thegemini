name: TalkOS Firebase Hosting (manual production)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm production Hosting release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: talkos-firebase-production
  cancel-in-progress: false

jobs:
  deploy-hosting:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment configuration
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          API_KEY: ${{ vars.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for key in PROJECT_ID API_KEY AUTH_DOMAIN APP_ID DATABASE_ID CREDENTIALS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required production Firebase configuration: $key"
              exit 1
            fi
          done
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - name: Build Firebase Hosting SPA only
        run: npm run build:pwa
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      - name: Authenticate Firebase deploy identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Hosting only (no Firestore or Storage rule changes)
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive
