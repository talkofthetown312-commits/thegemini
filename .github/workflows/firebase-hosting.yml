name: Firebase Hosting (manual, security-gated)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a reviewed release'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check production security approval and project mapping
        env:
          SECURITY_APPROVED: ${{ vars.SECURITY_REVIEW_APPROVED }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test "$SECURITY_APPROVED" = "true" || { echo "Security review is not approved; deployment blocked."; exit 1; }
          for key in PROJECT_ID DATABASE_ID WIF_PROVIDER SERVICE_ACCOUNT; do
            test -n "${!key}" || { echo "Missing required GitHub environment variable: $key"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - name: Build isolated static frontend
        run: npm run build:hosting
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      - name: Confirm server bundles and sourcemaps are not hosted
        run: |
          test -f dist-web/index.html
          test ! -e dist-web/server.cjs
          test ! -e dist-web/server.cjs.map
          test ! -e dist-web/.env
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Deploy static hosting only
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive
