name: TalkOS Source Snapshot (isolated)
on:
  push:
    branches: [feature/talkos-original-ui-recovery]
    paths: ['.github/workflows/talkos-source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o /tmp/talkos-source-snapshot.zip
          mkdir -p export
          mv /tmp/talkos-source-snapshot.zip export/
      - uses: actions/upload-artifact@v4
        with:
          name: TalkOS-source-snapshot
          path: export/talkos-source-snapshot.zip
          retention-days: 1
          if-no-files-found: error
