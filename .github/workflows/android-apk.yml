name: TalkOS Android Staging APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'assets/icon.png'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'ci/staging-debug-cert.sha256'
concurrency:
  group: talkos-android-staging
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.TALKOS_TEST_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.TALKOS_TEST_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.TALKOS_TEST_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.TALKOS_TEST_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.TALKOS_TEST_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TALKOS_TEST_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.TALKOS_TEST_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
      - name: Confirm isolated staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_FIREBASE_PROJECT_ID" = "talkos-staging-default"
          test "$VITE_FIREBASE_DATABASE_ID" = "(default)"
          test "$VITE_FIREBASE_MESSAGING_SENDER_ID" = "93376253053"
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_APP_ID; do
            test -n "${!key:-}" || { echo "::error::Missing $key"; exit 1; }
          done
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build:pwa
      - name: Install Capacitor in isolated tooling directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/talkos-capacitor-tools
          cd /tmp/talkos-capacitor-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 typescript@5 @capacitor/assets@3 sharp@0.34
          mkdir -p assets
          cp "$GITHUB_WORKSPACE/assets/icon.png" assets/icon.png
          node -e "const sharp=require('sharp'),fs=require('fs');sharp('assets/icon.png').resize(1024,1024).toBuffer().then(data=>fs.writeFileSync('assets/icon.png',data)).catch(e=>{console.error(e);process.exit(1)})"
          ln -s "$GITHUB_WORKSPACE"/dist dist
          cp "$GITHUB_WORKSPACE"/capacitor.config.ts ./capacitor.config.ts
          node -e "const fs=require('fs'); const p=require('./package.json'); p.type='module'; fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      # This debug key is ONLY for staging APKs. Cache it across hosted runners
      # so subsequent downloads remain installable as updates to the same app.
      # Never use this identity to sign a release or store production data.
      - name: Restore consistent Android staging signing identity
        id: staging-signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: talkos-staging-debug-signing-v1
      - name: Ensure staging signer has not silently rotated
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.staging-signing.outputs.cache-hit }}" != "true" ] && [ -f ci/staging-debug-cert.sha256 ]; then
            echo "::error::Pinned staging signing key missing from CI cache. Refusing to create another incompatible APK."
            exit 1
          fi
      - name: Bootstrap staging-only debug signer
        if: steps.staging-signing.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=TalkOS STAGING ONLY, O=Talk of the Town, C=IN" -noprompt
      - name: Verify pinned Android signer before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          signer_sha="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | cut -d' ' -f1)"
          echo "TalkOS staging certificate SHA256: $signer_sha"
          if [ -f ci/staging-debug-cert.sha256 ]; then
            test "$signer_sha" = "$(head -c 64 ci/staging-debug-cert.sha256)" || {
              echo "::error::Staging APK signing certificate mismatch. Refusing un-installable update."
              exit 1
            }
          fi
      - name: Preserve staging key for later APK builds
        if: steps.staging-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: talkos-staging-debug-signing-v1
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/talkos-capacitor-tools
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          ./node_modules/.bin/capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          # Monotonic Android versionCode also lets Android recognize updates correctly.
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -E "applicationId|versionCode" android/app/build.gradle
      - name: Build debug APK alongside Capacitor dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/talkos-capacitor-tools/android
          bash ./gradlew assembleDebug --no-daemon
      - name: Validate APK package and certificate
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apk="/tmp/talkos-capacitor-tools/android/app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -s "$apk" && test -x "$apksigner" && test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          package="$("$aapt" dump badging "$apk" | head -n 1 | cut -d "'" -f 2)"
          test "$package" = "com.talkofthetown.pos" || { echo "::error::Unexpected package $package"; exit 1; }
          actual_sha="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          key_sha="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | cut -d' ' -f1)"
          test "$actual_sha" = "$key_sha" || { echo "::error::APK is not signed with the pinned staging identity"; exit 1; }
          echo "Verified TalkOS package $package signed with staging certificate $actual_sha"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkOS-Android-STAGING-debug
          path: /tmp/talkos-capacitor-tools/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
