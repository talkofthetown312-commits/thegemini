name: TalkOS Windows EXE (Staging)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.TALKOS_TEST_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.TALKOS_TEST_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.TALKOS_TEST_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.TALKOS_TEST_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.TALKOS_TEST_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TALKOS_TEST_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.TALKOS_TEST_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm staging project
        shell: bash
        run: |
          test "$VITE_FIREBASE_PROJECT_ID" = "talkos-staging-default"
          test "$VITE_FIREBASE_DATABASE_ID" = "(default)"
          test "$VITE_FIREBASE_MESSAGING_SENDER_ID" = "93376253053"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_APP_ID"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Install Electron packaging tools
        run: npm install --no-save --package-lock=false electron@37 electron-builder@26
      - name: Build existing TalkOS Electron application
        run: npm run build:electron
      - name: Package Windows portable EXE
        run: npx electron-builder --win portable --publish never --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TalkOS-Windows-STAGING-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
