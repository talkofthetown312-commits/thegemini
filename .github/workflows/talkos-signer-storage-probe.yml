name: TalkOS Staging Signer Storage Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/talkos-signer-storage-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/93376253053/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: talkos-github-deployer@talkos-staging-default.iam.gserviceaccount.com
          project_id: talkos-staging-default
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe PRIVATE staging storage for retained debug keystore
        shell: bash
        run: |
          set -euo pipefail
          # No secrets or keystores are printed, saved or modified here.
          # Check whether a secure GCP location exists for the retained signer.
          # Metadata-only probes: no application records are accessed.
          if gcloud storage buckets list --project talkos-staging-default --format='value(name)' > bucket_names.txt 2>storage_probe_error.txt; then
            echo "STAGING_BUCKET_DISCOVERY_ALLOWED"
            head -n 8 bucket_names.txt
          else
            echo "STAGING_BUCKET_DISCOVERY_DENIED"
            head -n 5 storage_probe_error.txt
          fi
          if gcloud secrets list --project talkos-staging-default --limit 5 --format='value(name)' > secret_names.txt 2>secret_probe_error.txt; then
            echo "STAGING_SECRET_MANAGER_ACCESS_ALLOWED"
          else
            echo "STAGING_SECRET_MANAGER_ACCESS_DENIED"
            head -n 5 secret_probe_error.txt
          fi
          if gcloud storage ls 'gs://talkos-staging-default.firebasestorage.app/' >/dev/null 2>probe.txt; then
            echo 'STAGING_BUCKET_LIST_ALLOWED'
          else
            echo 'STAGING_BUCKET_LIST_DENIED'
            sed -n '1,7p' probe.txt
          fi
          if gcloud storage ls 'gs://talkos-staging-default.firebasestorage.app/_private/talkos-staging-debug.keystore' >/dev/null 2>probe2.txt; then
            echo 'STAGING_SIGNER_BACKUP_EXISTS'
          else
            echo 'STAGING_SIGNER_BACKUP_NOT_ACCESSIBLE'
            sed -n '1,7p' probe2.txt
          fi
