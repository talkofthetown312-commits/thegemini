name: TalkOS Isolated Firebase Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.TALKOS_TEST_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.TALKOS_TEST_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.TALKOS_TEST_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.TALKOS_TEST_FIRESTORE_DATABASE_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.TALKOS_TEST_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TALKOS_TEST_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.TALKOS_TEST_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse production or incomplete test configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.TALKOS_TEST_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.TALKOS_TEST_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_DATABASE_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing isolated test configuration: $key"; exit 1; fi
          done
          if [ "$VITE_FIREBASE_PROJECT_ID" != "talkos-staging-default" ] || [ "$VITE_FIREBASE_DATABASE_ID" != "(default)" ]; then
            echo "::error::Refusing unexpected project/database configuration"
            exit 1
          fi
          if [[ "$WIF_PROVIDER" != projects/*/locations/global/workloadIdentityPools/github-pool/providers/github-provider ]] || [ "$DEPLOY_SERVICE_ACCOUNT" != "talkos-github-deployer@talkos-staging-default.iam.gserviceaccount.com" ]; then
            echo "::error::Unexpected staging deployment identity"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build:pwa
      - name: Authenticate to staging Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TALKOS_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.TALKOS_TEST_SERVICE_ACCOUNT }}
          project_id: talkos-staging-default
      - name: Deploy to isolated test Hosting preview channel
        run: npx --yes firebase-tools hosting:channel:deploy talkos-validation --project talkos-staging-default --expires 7d --non-interactive
